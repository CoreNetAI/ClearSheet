name: Supabase keep-alive

# Free tier pauses a project after ~7 days of inactivity. This runs a tiny
# authenticated query daily so the project stays active even during quiet weeks.

on:
  schedule:
    - cron: "30 12 * * *" # daily
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lightweight query against Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "HTTP $CODE"
          # 200 (rows) or 206 (partial) both indicate the DB answered.
          if [ "$CODE" != "200" ] && [ "$CODE" != "206" ]; then
            echo "Keep-alive query failed."; exit 1
          fi
